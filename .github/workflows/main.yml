name: etl_pipeline_demo

on:
  push:
    branches:
      - main

jobs:
  etl_pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Run Extract
        run: python extract.py

      - name: Run Transform
        run: python transform.py

      - name: Run Load
        run: python load.py
